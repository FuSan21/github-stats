# Self-hosted GitHub profile cards for one user, using that user's own token so
# private contributions are counted. Only the gateway is exposed (Dokploy domain
# -> gateway:80); it allows just the card endpoints and just GITHUB_USER.

services:
  gateway:
    build: ./gateway
    restart: unless-stopped
    depends_on:
      - cards
    environment:
      GITHUB_USER: ${GITHUB_USER:?set GITHUB_USER}
      TZ: ${TZ:-Asia/Dhaka}
    volumes:
      - gateway-cache:/var/cache/nginx
    expose:
      - "80"

  # Every card: stats, top languages, streak, activity graph, open source PRs
  # and the view counter (Go, see cards/).
  cards:
    build: ./cards
    restart: unless-stopped
    environment:
      GITHUB_USER: ${GITHUB_USER}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?set GITHUB_TOKEN}
      # Only read on first start, when views-data is empty. 1718 was FuSan21's
      # komarev.com count when the counter replaced it (2026-10-23).
      INITIAL_VIEWS: ${INITIAL_VIEWS:-1718}
      PORT: "7000"
      TZ: ${TZ:-Asia/Dhaka}
    volumes:
      - views-data:/data
    expose:
      - "7000"

volumes:
  gateway-cache:
  views-data:
