# Self-hosted GitHub profile cards for one user, using that user's own token so
# private contributions are counted. Self-contained: the image is built straight
# from this repository on GitHub, so this file can be pasted into Dokploy's Raw
# compose (or run anywhere) without a checkout. Route your domain to cards:7000.
#
# Needs GITHUB_USER and GITHUB_TOKEN (see .env.example).

services:
  cards:
    build: https://github.com/FuSan21/github-stats.git#main:cards
    restart: unless-stopped
    environment:
      GITHUB_USER: ${GITHUB_USER:?set GITHUB_USER}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?set GITHUB_TOKEN}
      # Only read on first start, when views-data is empty. 1718 was FuSan21's
      # komarev.com count when the counter replaced it (2026-10-23).
      INITIAL_VIEWS: ${INITIAL_VIEWS:-1718}
      PORT: "7000"
      TZ: ${TZ:-Asia/Dhaka}
    volumes:
      - views-data:/data
    expose:
      - "7000"

volumes:
  views-data:
